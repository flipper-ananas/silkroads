name: AI Code Generator

on:
  issues:
    types: [opened, labeled]

jobs:
  generate-code:
    if: contains(github.event.issue.labels.*.name, 'ai-generate')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate code with Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          cat << 'EOF' > generate.mjs
          import https from 'https';
          import fs from 'fs';

          const prompt = `You are a senior React/Next.js developer and UI/UX expert.
          Stack: Next.js 14, TypeScript, Tailwind CSS, App Router.

          SILKROADS DESIGN SYSTEM - You MUST strictly follow these rules:

          Colors (use ONLY these Tailwind classes):
          - Primary: text-brand-primary / bg-brand-primary (red #E8393A)
          - Secondary: text-brand-secondary / bg-brand-secondary (cyan #2CC4D8)
          - Orange accent: text-brand-orange / bg-brand-orange (#F5A03C)
          - Light background: bg-brand-light (#F8F9FA)
          - Main text: text-brand-dark (#1A1A1A)
          - Secondary text: text-brand-muted (#6B7280)
          - Borders: border-brand-border (#E5E7EB)

          Typography (use ONLY these classes):
          - Main titles: text-display or text-h1 with font-bold
          - Subtitles: text-h2 or text-h3 with font-semibold
          - Body text: text-body-lg or text-body
          - Small text: text-small

          Available components to import from '@/components/ui':
          - Button (variants: primary, secondary, outline, ghost | sizes: sm, md, lg)
          - Card (hover=true for hover effect)
          - Container (automatic centering with padding)
          - Display, H1, H2, H3, BodyLg, Body (typography)

          Design rules:
          - Page background: bg-white or bg-brand-light
          - Alternating sections: bg-white then bg-brand-light
          - Rounded corners: rounded-xl or rounded-2xl
          - Shadows: shadow-soft, shadow-medium, shadow-strong
          - Section spacing: py-24
          - Minimal, airy, professional SaaS design
          - Mobile-first responsive mandatory
          - Subtle hover effects on all interactive elements
          - NEVER use generic Tailwind colors like gray-900, blue-500 etc.

          User Story: ${process.env.ISSUE_TITLE}
          Description: ${process.env.ISSUE_BODY}

          Generate a complete React component that STRICTLY follows this design system.
          Respond with TWO blocks separated by ---SEPARATOR---
          Block 1: The complete component (src/components/Feature-${process.env.ISSUE_NUMBER}.tsx)
          Block 2: Updated src/app/page.tsx that imports and displays this component
          ONLY TypeScript code, no explanations, no markdown tags.`;

          const data = JSON.stringify({
            model: 'claude-sonnet-4-6',
            max_tokens: 8096,
            messages: [{ role: 'user', content: prompt }]
          });

          const options = {
            hostname: 'api.anthropic.com',
            path: '/v1/messages',
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'x-api-key': process.env.ANTHROPIC_API_KEY,
              'anthropic-version': '2023-06-01',
              'Content-Length': Buffer.byteLength(data)
            }
          };

          const req = https.request(options, (res) => {
            let body = '';
            res.on('data', chunk => body += chunk);
            res.on('